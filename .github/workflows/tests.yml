name: Tests and package checks

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.8'
            extras: test
          - os: ubuntu-latest
            python: '3.12'
            extras: 'test,full'
          - os: ubuntu-latest
            python: '3.14'
            extras: 'test,full'
          - os: windows-latest
            python: '3.14'
            extras: test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[${{ matrix.extras }}]" "setuptools>=61" build wheel twine
      - name: Run deterministic regression and integration tests
        run: python -m pytest
      - name: Build and validate distributions
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Smoke test the installed wheel outside the source import path
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -I tests/wheel_smoke.py
