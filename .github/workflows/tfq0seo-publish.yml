name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    if: github.event.deleted == false
    uses: ./.github/workflows/tests.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build package
        run: python -m build
      - name: Validate release version and distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path('dist').glob('*.whl')
          with ZipFile(wheel) as archive:
              metadata_path, = (
                  name for name in archive.namelist()
                  if name.endswith('.dist-info/METADATA')
              )
              metadata = BytesParser().parsebytes(archive.read(metadata_path))
          expected = 'v' + metadata['Version']
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit('Release tag must match package version: ' + expected)
          PY
      - name: Store validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tfq0seo
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
